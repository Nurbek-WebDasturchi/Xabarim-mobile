<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Xabarim</title>
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" href="/img/logos/xabarim_logo.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/auth/auth.css" />
    <link rel="stylesheet" href="/css/spinner.css" />
  </head>
  <body class="auth-page">
    <div id="lang-slot" class="auth-language"></div>
    <main class="container-fluid auth-shell" id="parent">
      <a class="auth-brand" href="/pages/main.html" aria-label="Xabarim bosh sahifasi"><img src="/img/logos/xabarim_logo.svg" alt="" /><span>Xabarim</span></a>
      <section class="auth-card" id="first__box">
        <div class="auth-card__intro"><h1 data-i18n="signin"></h1><p data-i18n="auth_welcome"></p></div>
        <div class="auth-form-wrap" id="login__box">
          <form class="input__box" id="auth-form" novalidate>
            <div class="form-floating mb-3"><input type="text" class="form-control register-input" id="username" placeholder=" " maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false"><label for="username" class="register-label" data-i18n="username"></label></div>
            <div class="form-floating mb-3 auth-password-field"><input type="password" class="form-control register-input" id="password" placeholder=" " autocomplete="current-password"><label for="password" class="register-label" data-i18n="password"></label><button class="auth-eye-toggle" type="button" data-password-toggle aria-label="Parolni ko‘rsatish" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div>
            <div class="auth-alert" id="auth-err" role="alert" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary auth-submit" data-i18n="signin"></button>
          </form>
        </div>
        <p class="auth-switch"><span data-i18n="noacc"></span><a href="./registration.html" data-i18n="signup"></a></p>
      </section>
      <footer class="auth-footer">© 2026 Xabarim</footer>
    </main>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js" onerror="void 0"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/core/spin.js"></script>
    <script src="../../js/core/db.js"></script>
    <script src="../../js/auth/login.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  <script src="../../js/core/nozoom.js"></script>
  </body>
</html>
